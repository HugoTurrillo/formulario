<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>REGISTRO</title>
</head>
<body>
    <form class="formulario">
            <h1>REGISTRO DEL USUARIO</h1>
            <div class="contenedor">
                <div class="input-contenedor">
                    <img class="icon" src="img/usuario.png"/>
                    <input type="text" placeholder="Nombre de usuario">
                </div>
                <div class="input-contenedor">
                    <img class="icon" src="img/mail.png"/>
                    <input type="text" placeholder="Correo electronico">
                </div>
                <div class="input-contenedor">
                    <img class="icon" src="img/password.png"/>
                    <input type="password" placeholder="Contraseña">
                </div>
                <input type="submit" value="Registro" class="button">
                <p>Al registrase, acepta muestras condiciones de uso y políticas</p>
                <p>Ya tiene cuenta?<a class="link" href="index.html">Iniciar sesión</a></p>
            </div>

    </form>
</body>
</html>
